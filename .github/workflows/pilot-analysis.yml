name: Analyze saved real pilot

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID containing the real pilot checkpoint and results
        required: true
        type: string
  push:
    branches: [main]
    paths: [.github/pilot-analysis-request.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: midterm-live-pilot-2026
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install tested project
        run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - name: Analyze existing checkpoint with no provider requests
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          source = os.environ.get('SOURCE_RUN_ID')
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              request = json.loads(Path('.github/pilot-analysis-request.json').read_text())
              if request.get('format') != 'midterm-pilot-analysis-request-v1':
                  raise SystemExit('Explicit analysis request is required; no collection is permitted.')
              source = str(request.get('source_run_id', ''))
          if not source or not source.isascii() or not source.isdecimal():
              raise SystemExit('Provide a numeric source run ID.')
          subprocess.run([sys.executable, 'scripts/analyze_github_pilot.py', '--source-run-id', source,
                          '--output', 'artifacts/analyzed-pilot', '--bundle', 'artifacts/real-analysis.zip'], check=True)
          PY
      - name: Verify real results import in the Colab notebook
        run: python scripts/validate_notebook.py --results-bundle artifacts/real-analysis.zip --report artifacts/real_notebook_import.json
      - name: Retain real analysis tables and audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: midterm-real-analysis-${{ github.run_id }}
          path: |
            artifacts/real-analysis.zip
            artifacts/analyzed-pilot/analysis_report.json
            artifacts/real_notebook_import.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
