name: Real 24-candidate pilot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: midterm-live-pilot-2026
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Check secure provider credential
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('MEDIACLOUD_API_KEY'):
              raise SystemExit('Add MEDIACLOUD_API_KEY under repository Settings > Secrets and variables > Actions')
          PY
      - name: Install tested project
        run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - name: Restore most recent pilot checkpoint when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_github_pilot.py --output artifacts/live-pilot
      - name: Collect bounded real data and compute available reviewed features
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -m charisma_lab.pilot --output artifacts/live-pilot --run-network --download-fec --github-budget
      - name: Export Colab tables even when collection is partial
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from charisma_lab.transfer import create_bundle
          root = Path('artifacts/live-pilot')
          if (root / 'exports').is_dir():
              create_bundle({'pilot': root, 'agents': root / 'exports'}, 'artifacts/real-analysis.zip',
                            dataset_kind='real', source_commit=os.environ['GITHUB_SHA'])
          PY
      - name: Retain database checkpoint for bounded resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midterm-live-pilot-state
          path: artifacts/live-pilot/pilot.sqlite
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain real results and collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midterm-real-results-${{ github.run_id }}
          path: |
            artifacts/real-analysis.zip
            artifacts/live-pilot/pilot_report.json
            artifacts/live-pilot/pilot_plan.json
          if-no-files-found: ignore
          retention-days: 30
