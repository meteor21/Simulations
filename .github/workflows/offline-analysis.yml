name: Offline tests and analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - name: Check dependencies and embedded Python source
        run: |
          python -m pip check
          python scripts/sync_notebook.py --check
      - name: Run tests
        run: python -m pytest --junitxml=artifacts/test_results.xml
      - name: Execute default notebook with network denied
        run: python scripts/validate_notebook.py --report artifacts/notebook_execution.json
      - name: Run synthetic analyses and build Colab bundle
        run: python scripts/run_offline_analysis.py --output artifacts
      - name: Verify notebook result import
        run: python scripts/validate_notebook.py --results-bundle artifacts/offline-analysis.zip --report artifacts/notebook_bundle_import.json
      - name: Upload results and validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midterm-offline-analysis-${{ github.sha }}
          path: |
            artifacts/offline-analysis.zip
            artifacts/test_results.xml
            artifacts/notebook_execution.json
            artifacts/notebook_bundle_import.json
          if-no-files-found: error
          retention-days: 14
